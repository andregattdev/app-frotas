spring.application.name=api-frota
spring.config.import=optional:file:./application-local.properties

# Porta do servidor
server.port=8080
server.address=0.0.0.0
app.upload.directory=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/api-frota}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.main.allow-bean-definition-overriding=true

jwt.expiration=3600000
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
